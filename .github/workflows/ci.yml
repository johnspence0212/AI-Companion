name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enterprise_starter
          POSTGRES_PASSWORD: enterprise_starter
          POSTGRES_DB: enterprise_starter_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_starter -d enterprise_starter_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore EnterpriseStarter.sln
      - name: Vulnerable packages
        run: |
          set -euo pipefail
          output="$(dotnet list EnterpriseStarter.sln package --vulnerable --include-transitive || true)"
          echo "$output"
          if echo "$output" | grep -qiE 'Severity[[:space:]]+\|' || echo "$output" | grep -qi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
      - name: Build
        run: dotnet build EnterpriseStarter.sln --no-restore
      - name: Test
        run: dotnet test apps/api.tests/Api.Tests.csproj --verbosity normal
        env:
          Database__Provider: PostgreSQL
          Database__ConnectionString: Host=localhost;Port=5432;Database=enterprise_starter_tests;Username=enterprise_starter;Password=enterprise_starter

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: npm audit production (high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build
      - run: npm run build-storybook
      - run: npm run api:check

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enterprise_starter
          POSTGRES_PASSWORD: enterprise_starter
          POSTGRES_DB: enterprise_starter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_starter -d enterprise_starter_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Run e2e
        working-directory: e2e
        run: npm test
        env:
          CI: true
          Database__ConnectionString: Host=localhost;Port=5432;Database=enterprise_starter_e2e;Username=enterprise_starter;Password=enterprise_starter
